<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Patient - Sunrise Dental Clinic</title>

    <link rel="stylesheet" href="/style.css">
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                    linear-gradient(
                            rgba(23, 42, 53, 0.94),
                            rgba(23, 42, 53, 0.94)
                    );

            color: #f1e8d5;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 560px;
            max-width: 100%;

            background: #203b44;

            border: 1px solid #365a62;

            border-radius: 14px;

            padding: 38px 42px;

            box-shadow:
                    0 10px 30px rgba(0,0,0,0.35);
        }


        /* =========================
           HEADER
        ========================= */

        .clinic-icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: #245f60;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }


        h1 {

            margin: 0;

            text-align: center;

            color: #54d6cf;

            font-size: 31px;

            letter-spacing: 0.5px;
        }


        .subtitle {

            text-align: center;

            margin: 8px 0 30px;

            color: #aebfbe;

            font-size: 15px;
        }


        /* =========================
           FORM
        ========================= */

        form {
            width: 100%;
        }


        label {

            display: block;

            margin-top: 18px;
            margin-bottom: 8px;

            color: #e5eeeb;

            font-size: 16px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 14px 15px;

            background: #172f38;

            color: #f1e8d5;

            border: 1px solid #4a6870;

            border-radius: 7px;

            font-size: 16px;

            transition: 0.2s;
        }


        input::placeholder {
            color: #849b9b;
        }


        input:focus {

            outline: none;

            border-color: #20c5bd;

            box-shadow:
                    0 0 0 3px rgba(32,197,189,0.12);
        }


        input:valid {
            border-color: #46656c;
        }


        /* =========================
           BUTTONS
        ========================= */

        .button-row {

            display: flex;

            gap: 12px;

            margin-top: 28px;
        }


        button {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .submit-btn {

            background: #20a9a4;

            color: #102d35;
        }


        .submit-btn:hover {

            background: #27c1bb;

            transform: translateY(-1px);
        }


        .back-btn {

            background: #40565d;

            color: #f1e8d5;
        }


        .back-btn:hover {

            background: #506970;

            transform: translateY(-1px);
        }


        button:active {
            transform: translateY(0);
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            text-align: center;

            margin-top: 20px;

            padding: 0;

            font-size: 15px;

            font-weight: bold;

            min-height: 20px;
        }


        .error {

            color: #ff8f8f;
        }


        .success {

            color: #64e0b1;
        }


        /* =========================
           BACK LINK
        ========================= */

        .dashboard-link {

            display: block;

            text-align: center;

            margin-top: 24px;

            color: #20c5bd;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }


        .dashboard-link:hover {

            color: #62ddd7;

            text-decoration: underline;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .container {

                padding: 30px 24px;

            }

            h1 {

                font-size: 27px;

            }

            .button-row {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- CLINIC ICON -->

    <div class="clinic-icon">
        🦷
    </div>


    <h1>
        Add New Patient
    </h1>


    <p class="subtitle">
        Sunrise Dental Clinic • Patient Management
    </p>



    <!-- =========================
         FORM
    ========================= -->

    <form id="patientForm">


        <!-- NAME -->

        <label for="name">
            Patient Name
        </label>

        <input
                type="text"
                id="name"
                placeholder="Enter patient name"
                minlength="2"
                maxlength="100"
                autocomplete="name"
                pattern=".*\s.*"
                required
        >



        <!-- ADDRESS -->

        <label for="address">
            Address
        </label>

        <input
                type="text"
                id="address"
                placeholder="Enter patient address"
                minlength="3"
                maxlength="200"
                autocomplete="street-address"
                required
        >



        <!-- EMAIL -->

        <label for="email">
            Email
        </label>

        <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                maxlength="100"
                autocomplete="email"
                required
        >



        <!-- PHONE -->

        <label for="phone">
            Phone Number
        </label>

        <input
                type="tel"
                id="phone"
                placeholder="0771234567"
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                autocomplete="tel"
                required
        >



        <!-- BUTTONS -->

        <div class="button-row">

            <button
                    type="submit"
                    class="submit-btn">

                Add Patient

            </button>


            <button
                    type="button"
                    class="back-btn"
                    onclick="window.location.href='patients.html'">

                Back

            </button>

        </div>


    </form>



    <!-- MESSAGE -->

    <div id="message"></div>


    <a
            href="dashboard.html"
            class="dashboard-link">

        ← Back to Dashboard

    </a>


</div>



<script>


    /* =====================================================
       ADD PATIENT
    ===================================================== */

    document
        .getElementById("patientForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    document.getElementById("message");


                message.innerText = "";

                message.className = "";



                /* =========================
                   GET VALUES
                ========================= */

                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const address =
                    document
                        .getElementById("address")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();



                /* =========================
                   NAME VALIDATION
                ========================= */

                if (name.length < 2) {

                    showError(
                        "Patient name must contain at least 2 characters."
                    );

                    return;
                }



                /* =========================
                   ADDRESS VALIDATION
                ========================= */

                if (address.length < 3) {

                    showError(
                        "Please enter a valid address."
                    );

                    return;
                }



                /* =========================
                   EMAIL VALIDATION
                ========================= */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (
                    !emailPattern.test(email)
                ) {

                    showError(
                        "Please enter a valid email address."
                    );

                    return;
                }



                /* =========================
                   PHONE VALIDATION
                ========================= */

                const phonePattern =
                    /^[0-9]{10}$/;


                if (
                    !phonePattern.test(phone)
                ) {

                    showError(
                        "Phone number must contain exactly 10 digits."
                    );

                    return;
                }



                /* =========================
                   PATIENT OBJECT
                ========================= */

                const patient = {

                    name: name,

                    address: address,

                    email: email,

                    phone: phone

                };



                /* =========================
                   DISABLE BUTTON
                ========================= */

                const submitButton =
                    document.querySelector(
                        ".submit-btn"
                    );


                submitButton.disabled = true;

                submitButton.innerText =
                    "Adding Patient...";



                /* =========================
                   SEND TO BACKEND
                ========================= */

                try {

                    const response =
                        await fetch(
                            "/patients",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        patient
                                    )

                            }
                        );



                    if (!response.ok) {

                        throw new Error(
                            "Failed to add patient"
                        );

                    }



                    /* =========================
                       SUCCESS
                    ========================= */

                    message.innerText =
                        "Patient added successfully!";

                    message.className =
                        "success";


                    document
                        .getElementById(
                            "patientForm"
                        )
                        .reset();


                    submitButton.disabled =
                        false;

                    submitButton.innerText =
                        "Add Patient";



                    /* =========================
                       REDIRECT
                    ========================= */

                    setTimeout(
                        function() {

                            window.location.href =
                                "patients.html";

                        },
                        1200
                    );


                } catch (error) {

                    console.error(
                        "Add patient error:",
                        error
                    );


                    showError(
                        "Error adding patient. Please try again."
                    );


                    submitButton.disabled =
                        false;

                    submitButton.innerText =
                        "Add Patient";

                }

            }
        );



    /* =====================================================
       ERROR MESSAGE
    ===================================================== */

    function showError(text) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            text;

        message.className =
            "error";

    }

</script>


</body>

</html>
