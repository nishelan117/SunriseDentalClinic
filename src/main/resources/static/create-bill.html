<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create New Bill - Sunrise Dental Clinic</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: #142f3a;

            color: #f5f5f5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        .container {
            width: 100%;
            max-width: 720px;

            background: #1e414c;

            border: 1px solid #35616b;

            border-radius: 10px;

            padding: 32px;

            box-shadow:
                    0 4px 15px rgba(0, 0, 0, 0.25);
        }


        h1 {
            text-align: center;

            margin: 0 0 8px;

            color: #ffffff;

            font-size: 30px;
        }


        .subtitle {
            text-align: center;

            color: #b8d2da;

            margin: 0 0 30px;

            font-size: 14px;
        }


        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        .form-group {
            width: 100%;
        }


        .full {
            grid-column: 1 / -1;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #ffffff;

            font-weight: bold;

            font-size: 14px;
        }


        .required {
            color: #20c5c2;
        }


        input,
        select {
            width: 100%;

            padding: 12px;

            border-radius: 5px;

            border: 1px solid #416b75;

            background: #12343e;

            color: #ffffff;

            font-size: 14px;
        }


        input::placeholder {
            color: #91b3bc;
        }


        input:focus,
        select:focus {
            outline: none;

            border-color: #20b9b6;

            box-shadow:
                    0 0 0 2px rgba(32, 185, 182, 0.15);
        }


        select option {
            background: #12343e;

            color: white;
        }


        .readonly {
            background: #173943;

            color: #bcd1d6;

            cursor: not-allowed;
        }


        .amount-section {
            margin-top: 25px;

            padding: 20px;

            background: #173943;

            border: 1px solid #35616b;

            border-radius: 8px;
        }


        .amount-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 8px 0;

            color: #c7dce1;

            font-size: 15px;
        }


        .amount-row.total {
            margin-top: 10px;

            padding-top: 15px;

            border-top: 1px solid #416b75;

            font-size: 20px;

            font-weight: bold;

            color: white;
        }


        #totalAmount {
            color: #20c5c2;

            font-size: 24px;
        }


        .button-row {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 28px;
        }


        button {
            border: none;

            border-radius: 5px;

            padding: 12px 25px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-btn {
            background: #20b9b6;

            color: #082b34;
        }


        .save-btn:hover {
            background: #19a5a2;
        }


        .clear-btn {
            background: #355965;

            color: white;
        }


        .clear-btn:hover {
            background: #426b77;
        }


        .back-btn {
            background: #777;

            color: white;
        }


        .back-btn:hover {
            background: #666;
        }


        #message {
            text-align: center;

            margin-top: 20px;

            font-weight: bold;

            min-height: 20px;
        }


        .success {
            color: #35d58a;
        }


        .error {
            color: #ff6b6b;
        }


        @media (max-width: 650px) {

            body {
                padding: 20px 10px;
            }


            .container {
                padding: 22px;
            }


            .form-grid {
                grid-template-columns: 1fr;
            }


            .full {
                grid-column: auto;
            }


            .button-row {
                flex-direction: column;
            }


            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Create New Bill
    </h1>


    <p class="subtitle">
        Create and manage patient bills at Sunrise Dental Clinic
    </p>


    <form id="billForm">


        <div class="form-grid">


            <!-- APPOINTMENT NUMBER -->

            <div class="form-group">

                <label for="appointmentNumber">

                    Appointment No.
                    <span class="required">*</span>

                </label>

                <select
                        id="appointmentNumber"
                        required>

                    <option value="">
                        Loading appointments...
                    </option>

                </select>

            </div>


            <!-- PATIENT NAME -->

            <div class="form-group">

                <label for="patientName">

                    Patient Name
                    <span class="required">*</span>

                </label>

                <input
                        type="text"
                        id="patientName"
                        placeholder="Patient name"
                        readonly
                        class="readonly"
                        required>

            </div>


            <!-- TREATMENT -->

            <div class="form-group">

                <label for="treatment">

                    Treatment
                    <span class="required">*</span>

                </label>

                <select
                        id="treatment"
                        required>

                    <option value="">
                        Loading treatments...
                    </option>

                </select>

            </div>


            <!-- TREATMENT FEE -->

            <div class="form-group">

                <label for="treatmentFee">

                    Treatment Fee (Rs.)

                </label>

                <input
                        type="number"
                        id="treatmentFee"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        value="0"
                        required>

            </div>


            <!-- CONSULTATION FEE -->

            <div class="form-group">

                <label for="consultationFee">

                    Consultation Fee (Rs.)

                </label>

                <input
                        type="number"
                        id="consultationFee"
                        value="2000"
                        readonly
                        class="readonly">

            </div>


            <!-- PAYMENT STATUS -->

            <div class="form-group">

                <label for="paymentStatus">

                    Payment Status
                    <span class="required">*</span>

                </label>

                <select
                        id="paymentStatus"
                        required>

                    <option value="Paid">
                        Paid
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Partial">
                        Partial
                    </option>

                </select>

            </div>


            <!-- BILL DATE -->

            <div class="form-group full">

                <label for="billDate">

                    Bill Date
                    <span class="required">*</span>

                </label>

                <input
                        type="date"
                        id="billDate"
                        required>

            </div>


        </div>


        <!-- AMOUNT SUMMARY -->

        <div class="amount-section">


            <div class="amount-row">

                <span>
                    Treatment Fee
                </span>

                <span id="displayTreatmentFee">
                    Rs. 0.00
                </span>

            </div>


            <div class="amount-row">

                <span>
                    Consultation Fee
                </span>

                <span id="displayConsultationFee">
                    Rs. 2,000.00
                </span>

            </div>


            <div class="amount-row total">

                <span>
                    Total Amount
                </span>

                <span id="totalAmount">
                    Rs. 2,000.00
                </span>

            </div>


        </div>


        <!-- BUTTONS -->

        <div class="button-row">


            <button
                    type="submit"
                    class="save-btn">

                + Create Bill

            </button>


            <button
                    type="button"
                    class="clear-btn"
                    onclick="clearForm()">

                Clear

            </button>


            <button
                    type="button"
                    class="back-btn"
                    onclick="goBack()">

                ← Back

            </button>


        </div>


    </form>


    <div id="message"></div>


</div>



<script>


    /* =====================================================
       CONSTANTS
    ===================================================== */

    const CONSULTATION_FEE = 2000;


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    document
        .getElementById("billDate")
        .value = today;



    /* =====================================================
       STORE APPOINTMENTS
    ===================================================== */

    let appointmentsList = [];



    /* =====================================================
       STORE SERVICES
    ===================================================== */

    let servicesList = [];



    /* =====================================================
       LOAD APPOINTMENTS
    ===================================================== */

    async function loadAppointments() {

        const select =
            document.getElementById(
                "appointmentNumber"
            );


        try {

            const response =
                await fetch("/appointments");


            if (!response.ok) {

                throw new Error(
                    "Failed to load appointments"
                );

            }


            const data =
                await response.json();


            /*
             * Support normal array response.
             */

            appointmentsList =
                Array.isArray(data)
                    ? data
                    : (
                        Array.isArray(data.data)
                            ? data.data
                            : []
                    );


            select.innerHTML =
                '<option value="">Select appointment...</option>';


            appointmentsList.forEach(
                function(appointment) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    /*
                     * IMPORTANT:
                     * Appointment.java uses
                     * appointmentNumber
                     */

                    const number =
                        appointment.appointmentNumber
                        || "";


                    option.value =
                        number;


                    option.textContent =
                        number
                        + " - "
                        + (
                            appointment.patientName
                            || "Unknown Patient"
                        );


                    /*
                     * Save appointment information
                     * inside the option.
                     */

                    option.dataset.patient =
                        appointment.patientName
                        || "";


                    /*
                     * IMPORTANT:
                     * Appointment.java uses
                     * treatmentType
                     */

                    option.dataset.treatment =
                        appointment.treatmentType
                        || "";


                    select.appendChild(
                        option
                    );

                }
            );


        }

        catch (error) {

            console.error(
                "Appointment loading error:",
                error
            );


            select.innerHTML =
                '<option value="">Unable to load appointments</option>';


            showError(
                "Unable to load appointments."
            );

        }

    }



    /* =====================================================
       LOAD TREATMENTS / SERVICES
    ===================================================== */

    async function loadTreatments() {

        const select =
            document.getElementById(
                "treatment"
            );


        try {

            const response =
                await fetch("/services");


            if (!response.ok) {

                throw new Error(
                    "Services endpoint unavailable"
                );

            }


            const data =
                await response.json();


            servicesList =
                Array.isArray(data)
                    ? data
                    : (
                        Array.isArray(data.data)
                            ? data.data
                            : []
                    );


            select.innerHTML =
                '<option value="">Select treatment...</option>';


            servicesList.forEach(
                function(service) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    const serviceName =
                        service.name
                        || service.serviceName
                        || service.treatment
                        || service.treatmentType
                        || "";


                    const servicePrice =
                        Number(
                            service.price
                            ?? service.amount
                            ?? service.fee
                            ?? service.treatmentFee
                            ?? 0
                        );


                    if (!serviceName) {

                        return;

                    }


                    option.value =
                        serviceName;


                    option.textContent =
                        serviceName
                        + " - Rs. "
                        + servicePrice.toFixed(2);


                    option.dataset.price =
                        servicePrice;


                    select.appendChild(
                        option
                    );

                }
            );


            /*
             * If no services were returned,
             * load default treatments.
             */

            if (
                select.options.length === 1
            ) {

                loadDefaultTreatments();

            }


        }

        catch (error) {

            console.warn(
                "Services could not be loaded:",
                error
            );


            loadDefaultTreatments();

        }

    }



    /* =====================================================
       DEFAULT TREATMENTS
    ===================================================== */

    function loadDefaultTreatments() {

        const treatments = [

            {
                name: "Dental Cleaning",
                price: 5000
            },

            {
                name: "Dental Filling",
                price: 7500
            },

            {
                name: "Root Canal",
                price: 25000
            },

            {
                name: "Tooth Extraction",
                price: 10000
            },

            {
                name: "Dental Checkup",
                price: 3000
            },

            {
                name: "Teeth Whitening",
                price: 15000
            }

        ];


        const select =
            document.getElementById(
                "treatment"
            );


        select.innerHTML =
            '<option value="">Select treatment...</option>';


        treatments.forEach(
            function(item) {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    item.name;


                option.textContent =
                    item.name
                    + " - Rs. "
                    + item.price.toFixed(2);


                option.dataset.price =
                    item.price;


                select.appendChild(
                    option
                );

            }
        );

    }



    /* =====================================================
       FIND / SELECT APPOINTMENT TREATMENT
    ===================================================== */

    function selectAppointmentTreatment(
        treatmentName
    ) {


        if (!treatmentName) {

            return;

        }


        const treatmentSelect =
            document.getElementById(
                "treatment"
            );


        const wanted =
            treatmentName
                .trim()
                .toLowerCase();


        /*
         * First try to find the treatment
         * in the services list.
         */

        for (
            let i = 0;
            i < treatmentSelect.options.length;
            i++
        ) {


            const option =
                treatmentSelect.options[i];


            const optionValue =
                String(
                    option.value || ""
                )
                    .trim()
                    .toLowerCase();


            if (
                optionValue === wanted
            ) {

                treatmentSelect.selectedIndex =
                    i;


                treatmentSelect.dispatchEvent(
                    new Event("change")
                );


                return;

            }

        }


        /*
         * If appointment treatment is not
         * available in /services, add it
         * automatically.
         */

        const newOption =
            document.createElement(
                "option"
            );


        newOption.value =
            treatmentName;


        newOption.textContent =
            treatmentName
            + " - Rs. 0.00";


        newOption.dataset.price =
            "0";


        treatmentSelect.appendChild(
            newOption
        );


        treatmentSelect.value =
            treatmentName;


        /*
         * Keep treatment fee at zero if
         * service price is unknown.
         */

        document
            .getElementById(
                "treatmentFee"
            )
            .value = "0";


        calculateTotal();

    }



    /* =====================================================
       APPOINTMENT CHANGE
    ===================================================== */

    document
        .getElementById(
            "appointmentNumber"
        )
        .addEventListener(
            "change",
            function () {


                const option =
                    this.options[
                        this.selectedIndex
                        ];


                if (
                    !option ||
                    !option.value
                ) {


                    document
                        .getElementById(
                            "patientName"
                        )
                        .value = "";


                    document
                        .getElementById(
                            "treatment"
                        )
                        .value = "";


                    document
                        .getElementById(
                            "treatmentFee"
                        )
                        .value = "0";


                    calculateTotal();


                    return;

                }


                /*
                 * Automatically fill patient.
                 */

                const patientName =
                    option.dataset.patient
                    || "";


                document
                    .getElementById(
                        "patientName"
                    )
                    .value =
                    patientName;


                /*
                 * Automatically select treatment.
                 */

                const appointmentTreatment =
                    option.dataset.treatment
                    || "";


                if (
                    appointmentTreatment
                ) {

                    selectAppointmentTreatment(
                        appointmentTreatment
                    );

                }

            }
        );



    /* =====================================================
       TREATMENT CHANGE
    ===================================================== */

    document
        .getElementById(
            "treatment"
        )
        .addEventListener(
            "change",
            function () {


                const option =
                    this.options[
                        this.selectedIndex
                        ];


                if (
                    !option ||
                    !option.value
                ) {


                    document
                        .getElementById(
                            "treatmentFee"
                        )
                        .value = "0";


                    calculateTotal();


                    return;

                }


                const price =
                    Number(
                        option.dataset.price
                    ) || 0;


                document
                    .getElementById(
                        "treatmentFee"
                    )
                    .value =
                    price;


                calculateTotal();

            }
        );



    /* =====================================================
       TREATMENT FEE CHANGE
    ===================================================== */

    document
        .getElementById(
            "treatmentFee"
        )
        .addEventListener(
            "input",
            calculateTotal
        );



    /* =====================================================
       CALCULATE TOTAL
    ===================================================== */

    function calculateTotal() {


        const treatmentFee =
            Number(
                document
                    .getElementById(
                        "treatmentFee"
                    )
                    .value
            ) || 0;


        const consultationFee =
            CONSULTATION_FEE;


        const total =
            treatmentFee
            + consultationFee;


        /*
         * Keep consultation fee fixed.
         */

        document
            .getElementById(
                "consultationFee"
            )
            .value =
            consultationFee;


        /*
         * Display treatment fee.
         */

        document
            .getElementById(
                "displayTreatmentFee"
            )
            .innerText =
            formatCurrency(
                treatmentFee
            );


        /*
         * Display consultation fee.
         */

        document
            .getElementById(
                "displayConsultationFee"
            )
            .innerText =
            formatCurrency(
                consultationFee
            );


        /*
         * Display total.
         */

        document
            .getElementById(
                "totalAmount"
            )
            .innerText =
            formatCurrency(
                total
            );

    }



    /* =====================================================
       CURRENCY FORMAT
    ===================================================== */

    function formatCurrency(
        amount
    ) {

        return "Rs. "
            + Number(amount)
                .toLocaleString(
                    "en-LK",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

    }



    /* =====================================================
       SUBMIT BILL
    ===================================================== */

    document
        .getElementById(
            "billForm"
        )
        .addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                clearMessage();


                const appointmentNumber =
                    document
                        .getElementById(
                            "appointmentNumber"
                        )
                        .value
                        .trim();


                const patientName =
                    document
                        .getElementById(
                            "patientName"
                        )
                        .value
                        .trim();


                const treatment =
                    document
                        .getElementById(
                            "treatment"
                        )
                        .value
                        .trim();


                const treatmentFee =
                    Number(
                        document
                            .getElementById(
                                "treatmentFee"
                            )
                            .value
                    ) || 0;


                /*
                 * Fixed consultation fee.
                 */

                const consultationFee =
                    CONSULTATION_FEE;


                const paymentStatus =
                    document
                        .getElementById(
                            "paymentStatus"
                        )
                        .value;


                const billDate =
                    document
                        .getElementById(
                            "billDate"
                        )
                        .value;


                const total =
                    treatmentFee
                    + consultationFee;



                /* =====================================
                   VALIDATION
                ===================================== */

                if (
                    !appointmentNumber
                ) {

                    showError(
                        "Please select an appointment."
                    );

                    return;

                }


                if (
                    !patientName
                ) {

                    showError(
                        "Patient name is required."
                    );

                    return;

                }


                if (
                    !treatment
                ) {

                    showError(
                        "Please select a treatment."
                    );

                    return;

                }


                if (
                    treatmentFee < 0
                ) {

                    showError(
                        "Treatment fee cannot be negative."
                    );

                    return;

                }


                if (
                    !billDate
                ) {

                    showError(
                        "Please select the bill date."
                    );

                    return;

                }



                /* =====================================
                   BILL OBJECT
                ===================================== */

                const bill = {

                    appointmentNumber:
                    appointmentNumber,

                    patientName:
                    patientName,

                    treatment:
                    treatment,

                    treatmentFee:
                    treatmentFee,

                    consultationFee:
                    consultationFee,

                    amount:
                    total,

                    paymentStatus:
                    paymentStatus,

                    billDate:
                    billDate

                };


                console.log(
                    "Sending bill:",
                    bill
                );



                /* =====================================
                   SAVE BILL
                ===================================== */

                try {


                    const response =
                        await fetch(
                            "/bills",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        bill
                                    )

                            }
                        );


                    if (
                        !response.ok
                    ) {

                        const errorText =
                            await response.text();


                        console.error(
                            "Server error:",
                            errorText
                        );


                        throw new Error(
                            "Failed to create bill"
                        );

                    }


                    const savedBill =
                        await response.json();


                    console.log(
                        "Saved bill:",
                        savedBill
                    );


                    showSuccess(
                        "Bill created successfully!"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "billing.html";

                        },
                        1000
                    );


                }

                catch (error) {

                    console.error(
                        "Bill creation error:",
                        error
                    );


                    showError(
                        "Failed to create bill. Please try again."
                    );

                }

            }
        );



    /* =====================================================
       CLEAR FORM
    ===================================================== */

    function clearForm() {


        document
            .getElementById(
                "billForm"
            )
            .reset();


        document
            .getElementById(
                "patientName"
            )
            .value = "";


        document
            .getElementById(
                "treatmentFee"
            )
            .value = "0";


        document
            .getElementById(
                "consultationFee"
            )
            .value =
            CONSULTATION_FEE;


        document
            .getElementById(
                "billDate"
            )
            .value =
            today;


        clearMessage();


        calculateTotal();

    }



    /* =====================================================
       BACK
    ===================================================== */

    function goBack() {

        window.location.href =
            "billing.html";

    }



    /* =====================================================
       SUCCESS MESSAGE
    ===================================================== */

    function showSuccess(
        text
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            text;


        message.className =
            "success";

    }



    /* =====================================================
       ERROR MESSAGE
    ===================================================== */

    function showError(
        text
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            text;


        message.className =
            "error";

    }



    /* =====================================================
       CLEAR MESSAGE
    ===================================================== */

    function clearMessage() {

        const message =
            document.getElementById(
                "message"
            );


        message.innerText = "";

        message.className = "";

    }



    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    async function initializePage() {

        calculateTotal();

        /*
         * Load both data sources.
         */

        await Promise.all([
            loadAppointments(),
            loadTreatments()
        ]);

    }


    initializePage();


</script>


</body>

</html>
